services:
  # Ollama - Local LLM Server
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - refund-network
    # GPU support (uncomment if you have NVIDIA GPU)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Refund Bot - Main service
  refund-bot:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/refund_bot.db
      - ORDERS_SERVICE_URL=http://mock-orders:8001
      - PAYMENTS_SERVICE_URL=http://mock-payments:8002
      - LLM_API_URL=${LLM_API_URL:-http://ollama:11434/v1}
      - LLM_API_KEY=${LLM_API_KEY:-ollama}
      - LLM_MODEL=${LLM_MODEL:-llama3.2:1b}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data
    depends_on:
      - mock-orders
      - mock-payments
      - ollama
    networks:
      - refund-network

  # Mock Orders Service
  mock-orders:
    build:
      context: ./services/mock-orders
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    networks:
      - refund-network

  # Mock Payments Service
  mock-payments:
    build:
      context: ./services/mock-payments
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    networks:
      - refund-network

networks:
  refund-network:
    driver: bridge

volumes:
  ollama_data:
